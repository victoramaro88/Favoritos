<p-blockUI [blocked]="boolLoading">
  <div *ngIf="boolLoading" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '50px', height: '50px' }" />
  </div>
</p-blockUI>
<p-toast />

<h1 class="text-center">FAVORITOS</h1>

<div class="text-center mt-4">
  <p-button [routerLink]="'/cadastro'" label="Manutenção" [rounded]="true" [raised]="true" severity="danger" size="small"/>
</div>

<br>

<div class="card flex justify-center">
  <p-tieredmenu [model]="items" />
</div>
