<p-blockUI [blocked]="boolLoading">
  <div *ngIf="boolLoading" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '50px', height: '50px' }" />
  </div>
</p-blockUI>
<p-toast />

<h1 class="text-center">MANUTENÇÃO</h1>

<div class="text-center mt-4">
  <p-button [routerLink]="'/exibir'" label="Cancelar" [rounded]="true" [raised]="true" severity="danger" size="small"/>
</div>

<br>

<div class="menu-container">
 <ul class="menu">
  <li class="submenu-item" *ngFor="let itemPai of lstMenus">
    <a *ngIf="itemPai.CatPai === null">
      {{itemPai.CatDesc}}
    </a>
    <ul class="submenu" *ngFor="let itemFilhos of itemPai.SubCategorias">
      <li class="" *ngIf="itemFilhos.CatPai === itemPai.CatCodi">
        <a>{{itemFilhos.CatDesc}}</a>
      </li>
    </ul>
  </li>
 </ul>
</div>

<br><hr><br>

<div class="menu-container">
  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li class="submenu-item">
      <a href="#">Sobre</a>
      <ul class="submenu">
        <li><a href="#">Quem Somos</a></li>
        <li><a href="#">Nossa Missão</a></li>
      </ul>
    </li>
    <li class="submenu-item">
      <a href="#">Serviços</a>
      <ul class="submenu">
        <li><a href="#">Consultoria</a></li>
        <li><a href="#">Desenvolvimento</a></li>
      </ul>
    </li>
    <li><a href="#">Contato</a></li>
  </ul>
</div>
